# Deploys the website to the existing Cloudflare Pages project on every push to master.
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Skips quietly until both exist.
name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [master, main]
    paths:
      - index.html
      - owner.html
      - config.js
      - app.js
      - business.js
      - styles.css
      - sw.js
      - manifest.webmanifest
      - assets/**
      - .github/workflows/deploy-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Cloudflare secrets not set yet; skipping website deploy."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - name: Build the public site
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p release
          cp index.html owner.html config.js app.js business.js styles.css sw.js manifest.webmanifest release/
          cp -R assets release/assets
          grep -q "business.js" release/index.html || { echo "::error::index.html does not load business.js"; exit 1; }

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy release --project-name=treasures-by-mudaso --branch=main --commit-dirty=true
